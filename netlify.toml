[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Map /api/narrate → Netlify function
[[redirects]]
  from   = "/api/narrate"
  to     = "/.netlify/functions/narrate"
  status = 200

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
